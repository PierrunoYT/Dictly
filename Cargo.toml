[package]
name = "dictly"
version = "0.1.0"
edition = "2024"
description = "Hotkey dictation for Windows, macOS, and Linux (X11) in Rust"
license = "GPL-3.0-or-later"

[features]
# End-to-end testing only: DICTLY_TEST_AUDIO=<16-bit WAV> replaces the microphone.
test-audio = []

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
cpal = "0.15"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }

[dev-dependencies]
tiny_http = "0.12"
egui_kittest = { version = "0.33", default-features = false, features = ["eframe"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "3.7", default-features = false }
enigo = "0.6"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }
x11rb = "0.13"

[profile.release]
lto = "thin"
strip = true
